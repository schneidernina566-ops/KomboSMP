# ==========================================================
#  Modul: rtp  (Befehle /rtp und /rtpq)
#  cost:             Kosten in Shards (0 = gratis)
#  cooldown-seconds: Wartezeit bis zum nächsten Teleport
#  min-radius:       Mindestabstand vom aktuellen Standort
#  radius:           maximaler Abstand
#  attempts:         Versuche, einen sicheren Ort zu finden
# ==========================================================
rtp:
  cost: 50
  cooldown-seconds: 300
  min-radius: 200
  radius: 5000
  attempts: 15

rtpq:
  cost: 10
  cooldown-seconds: 60
  min-radius: 50
  radius: 1000
  attempts: 10
